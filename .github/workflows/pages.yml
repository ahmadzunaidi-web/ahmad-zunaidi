name: Publish ASCENDO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ASCENDO
        run: |
          mkdir -p build
          unzip -q ASCENDO_Phone_to_APK.zip -d build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/ascendo_all

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
