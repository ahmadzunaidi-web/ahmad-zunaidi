 naik, anda boleh terus hantar borang.</p>${btn('Semak Status Dokumen','refreshDocs','secondary')}${docsHTML({category:draft.category||'government',docs:draft.docs||{}},'draft')}${draft.income2Category?`<div class="line"></div><h3>Dokumen Income Kedua · ${esc(catLabel(draft.income2Category))}</h3><p class="sub">Dokumen untuk income kedua sahaja. IC dan lesen tidak perlu dimuat naik semula.</p>${docsHTML({category:draft.category||'government',docs:draft.docs||{}},'draft',DOCS2[draft.income2Category]||[])}`:''}`:`<div class="sectiontitle">Semakan Akhir</div><div class="grid two"><div class="dateblock"><div class="tag">PEMOHON</div><h3 data-user-content>${esc(draft.name||'Belum lengkap')}</h3><p class="muted">IC: <span data-user-content>${esc(draft.ic||'—')}</span><br><span>Telefon:</span> <span data-user-content>${esc(draft.phone||'—')}</span><br><span>Kereta:</span> <span data-user-content>${esc(draft.model||'Belum dipilih')}</span><br><span>Kategori:</span> <span>${esc(catLabel(draft.category||'government'))}</span>${draft.income2Category?`<br><span>Income kedua:</span> <span>${esc(catLabel(draft.income2Category))}</span>`:''}</p></div><div class="dateblock"><div class="tag">DOKUMEN</div><h3>${filled({category:draft.category||'government',income2Category:draft.income2Category||'',docs:draft.docs||{}})} / ${required({category:draft.category||'government',income2Category:draft.income2Category||''})} lengkap</h3><p class="muted">Semua dokumen wajib perlu lengkap sebelum permohonan boleh dihantar.</p></div></div>${inc2Problem(draft)?`<div class="notice red" style="margin-top:14px">${esc(inc2Problem(draft))} ${btn('Betulkan Income Kedua','step:1','secondary sm')}</div>`:''}${refProblem(draft)?`<div class="notice red" style="margin-top:14px">${esc(refProblem(draft))} ${btn('Betulkan Rujukan','step:2','secondary sm')}</div>`:''}<div class="notice" style="margin-top:14px">Selepas hantar, tugasan bertukar kepada salesman untuk menyediakan VSO.</div>`}<div class="btnrow">${applyStage?btn('← Kembali','step:'+(applyStage-1),'secondary'):''}${applyStage<3?btn('Seterusnya →','step:'+(applyStage+1),''):`<label class="check"><input type="checkbox" id="privacyConsent"><span>Saya telah membaca <a href="./privacy.html" target="_blank">notis privasi</a> dan bersetuju maklumat digunakan bagi urusan pembiayaan serta kenderaan.</span></label>`+btn('Hantar Permohonan','submitApply','')}</div></div>`,btn('Simpan Draf','saveDraft','secondary')+btn('Semak Progress','lookup','ghost'));}
function docsHTML(c,scope,rows=DOCS[c.category]||[]){
 const documents=c.documents||caseById()?.documents||[],r=rows.filter(x=>!x[2]).length;
 const uploaded=rows.filter(([key,,optional])=>!optional&&documents.some(d=>d.slot===key&&d.scan_status!=='infected')).length;
 return `<div class="flex space" style="margin-bottom:8px"><b>${uploaded} / ${r} dimuat naik</b><span class="gold">${Math.round(uploaded/Math.max(r,1)*100)}%</span></div><div class="progress"><i style="width:${Math.round(uploaded/Math.max(r,1)*100)}%"></i></div><p class="hint">Dokumen yang berjaya dimuat naik terus dikira lengkap.</p><div style="margin-top:15px">${rows.map(([key,label,optional])=>{const d=documents.find(d=>d.slot===key),received=!!d&&d.scan_status!=='infected';return `<div class="docrow"><div class="text"><div><b>${esc(label)}</b> ${optional?pill('Optional'):''}</div><div class="file" role="status">${received?'Berjaya dimuat naik':d?'Fail ditolak. Muat naik fail baharu.':'Belum dimuat naik'}</div>${d?.size?`<div class="hint">${esc(d.mime||'')} · ${Math.ceil(d.size/1024)} KB</div>`:''}</div><span>${received?'✅':'○'}</span>${identity?.role==='admin'&&received?btn('Buka','openDoc:'+d.id,'ghost sm'):''}<input type="file" data-doc="${key}" data-scope="${scope}" aria-label="${esc(label)}" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf,.heic,.heif">${uplHTML(key)}</div>`}).join('')}</div>`;
}
function orphanDocs(c){const known=new Set(docRows(c).map(x=>x[0])),extra=(c.documents||[]).filter(d=>!known.has(d.slot)&&d.scan_status!=='infected');if(identity?.role!=='admin'||!extra.length)return '';return `<div class="line"></div><h3>Dokumen Lain Dimuat Naik</h3><p class="hint">Dokumen daripada kategori yang telah ditukar oleh pelanggan. Tidak dikira dalam dokumen wajib.</p>${extra.map(d=>`<div class="docrow"><div class="text"><b data-i18n-skip>${esc(d.slot)}</b></div>${btn('Buka','openDoc:'+d.id,'ghost sm')}</div>`).join('')}`;}
function detail(){const c=caseById();if(!c){view='dashboard';return dashboard()};const next=task(c);const tabNames=[['personal','Maklumat'],['docs','Dokumen'],['vso','VSO'],['loan','Bank & LOU'],['ops','Delivery']];let body=tab==='personal'?`<div class="grid two"><div class="card"><h3>Maklumat Pemohon</h3>${[['name','Nama'],['ic','IC'],['phone','Tel'],['email','E-mel'],['mailAddress','Alamat IC'],['currentAddress','Alamat semasa'],['race','Bangsa'],['religion','Agama'],['marital','Status'],['children','Anak'],['home','Rumah'],['stayYears','Tempoh tinggal'],['education','Pendidikan'],['mother','Nama Ibu'],['colour','Warna Pilihan']].map(([x,l])=>infoRow(l,c[x])).join('')}</div><div class="stack"><div class="card"><h3>Pasangan</h3>${[['spouseName','Nama'],['spouseIc','IC'],['spouseJob','Jawatan'],['spouseEmployer','Majikan'],['spousePhone','Telefon'],['spouseSalary','Gaji (RM)']].map(([x,l])=>infoRow(l,c[x])).join('')}</div><div class="card"><h3>Pekerjaan</h3>${[['category','Kategori'],['employer','Majikan'],['employerAddress','Alamat'],['job','Jawatan'],['jobStatus','Status'],['startDate','Tarikh mula'],['officePhone','Telefon'],['retireAge','Umur bersara'],['hrEmail','Emel HR']].map(([x,l])=>infoRow(l,x==='category'?catLabel(c.category):c[x])).join('')}</div>${c.income2Category?`<div class="card"><h3>Income Kedua</h3>${[['income2Category','Kategori'],['inc2Employer','Majikan'],['inc2EmployerAddress','Alamat'],['inc2Job','Jawatan'],['inc2JobStatus','Status'],['inc2StartDate','Tarikh mula'],['inc2OfficePhone','Telefon'],['inc2Income','Pendapatan (RM)']].map(([x,l])=>infoRow(l,x==='income2Category'?catLabel(c[x]):c[x])).join('')}</div>`:''}<div class="card"><h3>Rujukan</h3>${[['refName','Nama'],['refRel','Hubungan'],['refPhone','Tel']].map(([x,l])=>infoRow(l,c[x])).join('')}</div></div></div>`:tab==='docs'?`<div class="card"><h3>Dokumen Permohonan · ${esc(catLabel(c.category))}</h3><p class="sub">Muat naik gambar atau PDF. Tiada had saiz tambahan oleh aplikasi. Dokumen dipadam automatik selepas 21 hari dari tarikh upload. Selepas semua dokumen wajib dimuat naik, anda boleh terus hantar borang.</p>${btn('Semak Status Dokumen','refreshDocs','secondary')}${docsHTML(c,'case')}${c.income2Category?`<div class="line"></div><h3>Dokumen Income Kedua · ${esc(catLabel(c.income2Category))}</h3>${docsHTML(c,'case',DOCS2[c.income2Category]||[])}`:''}${orphanDocs(c)}</div>`:tab==='vso'?vsoPanel(c):tab==='loan'?bankPanel(c):opsPanel(c);
layout(c.name,`${c.id} · ${c.model||'Belum pilih kereta'} · ${esc(catLabel(c.category))}`,`<div class="grid two"><div class="card"><div class="flex space"><div><div class="tag">CURRENT STATUS</div><h3 style="margin:5px 0 2px">${esc(status(c))}</h3><div class="sub">${esc(next[1])}</div></div>${pill(next[0],next[0]==='Pelanggan'?'warn':'')}</div><div class="flex space" style="margin:19px 0 7px"><b>Journey Progress</b><b class="gold">${progress(c)}%</b></div><div class="progress"><i style="width:${progress(c)}%"></i></div></div><div class="card"><div class="tag">QUICK ACTIONS</div><div class="btnrow">${btn('Customer Preview','portal:'+c.id,'ghost sm')}${btn('Share WhatsApp','wa:'+c.id,'green sm')}${btn('Copy Tracker Link','copy:'+c.id,'secondary sm')}${btn('Pautan Sambung / Review','reinvite:'+c.id,'secondary sm')}${c.canDeleteEmpty?btn('Padam Rekod Kosong','deleteEmpty:'+c.id,'ghost sm'):''}</div><p class="hint">WhatsApp manual sahaja.</p></div></div><div class="tabs">${tabNames.map(([k,x])=>`<button class="tab ${tab===k?'active':''}" data-action="tab:${k}">${x}</button>`).join('')}</div>${body}<section class="card" style="margin-top:17px"><h3>8 Milestone · WhatsApp Update</h3><p class="sub">Tekan WhatsApp pada milestone yang selesai atau sedang diproses. Mesej dibuka untuk SA semak dan hantar sendiri.</p>${timeline(c,true)}</section>`,btn('← Pipeline','cases','secondary sm'));}
function timeline(c,allowShare=false){
 let started=false;const tasks=stepTasks(c);
 return `<div class="timeline">${milestones(c).map((m,i)=>{
 const current=!m[1]&&!started;
 if(current)started=true;
 const canShare=allowShare&&(m[1]||current);
 return `<div class="mile ${m[1]?'is-done':current?'is-now':'is-next'}"><div class="mile-left"><div class="dot ${m[1]?'done':current?'now':''}">${m[1]?'✓':i+1}</div>${i<7?'<div class="stem"></div>':''}</div>
 <div class="milebody"><div class="milestatus"><div class="miletitle">${esc(m[0])} ${current?pill('Sedang Diproses','warn'):m[1]?pill('Selesai','ok'):''}</div>${canShare?btn('◉ WhatsApp','waStep:'+c.id+':'+i,'green mile-share'):''}</div><div class="miletext">${esc(m[2])}</div>${(()=>{const [d,t,nx]=tasks[i];return stepBar(d,t,m[1],nx);})()}</div></div>`;
 }).join('')}</div>`;
}

function vsoPanel(c){
 const v=c.vso||{};
 const fields=[['dealer','Dealer (dipilih oleh SA)',{options:[['','— Pilih dealer dahulu —'],['sinar','Sinar Auto Sdn Bhd'],['dwidinars','DwiDinars Automobil Sdn Bhd'],['wan','Wan Motorsports (M) Sdn Bhd'],['pmsk','PMSK Sdn Bhd'],['dtc','DTC Motors Sdn Bhd'],['bumi','Bumi Muhibah Motors Sdn Bhd'],['authentic','Authentic Model Sdn Bhd'],['ecw','ECW Motorsports Sdn Bhd']]}],['stock','Stock Number'],['model','Model Kereta'],['year','Tahun'],['colour','Warna'],['chassis','Chassis Number'],['engine','Engine Number'],['carPrice','Selling Price (RM)',{type:'number'}],['loanAmount','Loan Amount (RM)',{type:'number'}],['tenure','Loan Tenure (tahun)',{type:'number'}],['fees','Registration / Other Fees (RM)',{type:'number'}]];

 <div class="notice">SA sendiri pilih dealer daripada 8 template. <b>Auto-fill daripada customer hanya Nama, No. IC dan Alamat.</b> SA isi butiran kereta dan pembiayaan; kemudian jana PDF untuk bank.</div>

 <h3 style="margin:16px 0 10px">SA Pilih Dealer & Isi Vehicle / Financing</h3>
 <div class="fieldgrid">${fields.map(([k,l,o])=>field('vso.'+k,l,{...(o||{}),val:v[k]??''})).join('')}</div>
 <div class="btnrow">${btn('Simpan Butiran VSO','saveVso','secondary')}${btn('Buka VSO + Jana PDF ↗','openVso','')}${btn(v.ready?'✓ VSO Disiapkan':'Tandakan VSO Siap','readyVso',v.ready?'ghost':'secondary')}</div>

}

function bankPanel(c){const pendingVso=!c.vso?.ready;return `<div class="grid two"><div class="stack"><section class="card"><div class="cardhead"><h3>Bank Submission · SA sahaja</h3>${pill((c.banks||[]).length+' bank')}</div>${pendingVso?'<p class="blocker">Selesaikan VSO sebelum hantar kepada bank.</p>':''}<div class="fieldgrid"><div class="field"><label>Tarikh submit</label><input id="bankDate" type="date" value="${today()}"></div><div class="field"><label>Nama Bank</label><input id="bankName" placeholder="Contoh: CIMB"></div><div class="field"><label>Bank Branch</label><input id="bankBranch" placeholder="Cawangan"></div><div class="field"><label>MO Bank</label><input id="bankMo" placeholder="Pegawai / Mortgage Officer"></div></div><div class="btnrow">${btn('＋ Tambah Bank Submission','addBank',pendingVso?'secondary':'') }</div><div class="hint">Maklumat bank ini tidak dipaparkan pada Customer Portal.</div><div class="line"></div>${(c.banks||[]).map((b,i)=>`<div class="rrow"><div><b data-user-content>Bank ${String.fromCharCode(65+i)} · ${esc(b.name)}</b><div class="item-meta">${nice(b.date)} · ${esc(b.branch)} · MO: ${esc(b.mo)}</div></div>${pill(b.status||'submitted',b.status==='approved'?'ok':b.status==='declined'?'bad':'')}</div>`).join('')||'<p class="muted small">Belum ada bank submission.</p>'}</section><section class="card"><h3>Keputusan Loan</h3><div class="btnrow">${btn('Approved','approved','')}${btn('Declined','declined','danger')}${btn('Pending','pendingDecision','secondary')}</div><div class="sub" style="margin-top:10px">Keputusan semasa: <b>${esc(c.decision)}</b></div>${c.decision==='declined'?`<div class="notice red" style="margin-top:14px">Loan declined. Pilih resubmit ke bank lain atau rekodkan refund booking.</div><div class="btnrow">${btn('Submission Bank Lain','resubmit','secondary')}${btn('Rekod Refund / Tutup Kes','refund','danger')}</div>`:''}</section></div><div class="stack"><section class="card"><h3>Selepas Loan Approved</h3>${c.decision!=='approved'?`<p class="muted">Pilihan next step dibuka selepas SA sahkan approval.</p>`:`<div class="field"><label>Pilih Laluan</label><select id="route"><option value="ready" ${c.route==='ready'?'selected':''}>READY STOCK — Sign LOU</option><option value="arrival" ${c.route==='arrival'?'selected':''}>TUNGGU KERETA SAMPAI SHOWROOM</option></select></div><div class="btnrow">${btn('Simpan Laluan','saveRoute','secondary')}</div>${c.route==='arrival'?`<div class="line"></div><div class="sectiontitle">Anggaran Ketibaan</div><div class="fieldgrid"><div class="field"><label>Dari</label><input id="arrivalFrom" type="date" value="${esc(c.arrivalFrom)}"></div><div class="field"><label>Hingga</label><input id="arrivalTo" type="date" value="${esc(c.arrivalTo)}"></div></div><div class="btnrow">${btn('Simpan Jangkaan','saveArrival','secondary')}${btn(c.arrived?'✓ Tiba di Showroom':'Sahkan Kereta Telah Tiba','arrived','')}</div>`:''}<div class="line"></div><h3>Letter of Undertaking</h3><div class="sub">Tugasan pelanggan: tandatangan LOU. SA rekod tarikh selepas selesai.</div>${c.route==='arrival'&&!c.arrived?'<p class="blocker" style="margin-top:12px">LOU hanya aktif selepas ketibaan kereta disahkan.</p>':`<div class="field" style="margin-top:12px"><label>Tarikh Signed LOU</label><input id="louDate" type="date" value="${esc(c.louSigned)}"></div><div class="btnrow">${btn('Sahkan Sign LOU','signedLou','')}</div>`}`}</section><section class="card"><h3>Customer Visibility</h3><p class="small muted">Customer hanya nampak:<br>• Loan submitted / pending / approved / declined<br>• Pilihan menunggu kereta atau signing LOU<br>• Tarikh ketibaan anggaran jika SA masukkan</p><p class="small gold">Bank, branch, MO dan data pembiayaan tidak dipaparkan.</p></section></div></div>`}

async function compressReviewPhoto(file){if(!file||!/^image\//.test(file.type||'image/'))throw new Error('Sila pilih fail gambar.');if(file.size>25*1024*1024)throw new Error('Gambar terlalu besar. Pilih gambar bawah 25MB.');
let source;try{source=await createImageBitmap(file,{imageOrientation:'from-image'});}catch{source=await new Promise((ok,fail)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(u);ok(img)};img.onerror=()=>{URL.revokeObjectURL(u);fail(new Error('Format gambar tidak disokong. Pilih JPEG atau PNG.'))};img.src=u;});}
const w=source.width||source.naturalWidth,h=source.height||source.naturalHeight;if(!w||!h)throw new Error('Gambar tidak sah.');const scale=Math.min(1,1600/Math.max(w,h));const canvas=document.createElement('canvas');canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(source,0,0,canvas.width,canvas.height);source.close?.();
for(const q of [0.85,0.72,0.6]){const blob=await new Promise(ok=>canvas.toBlob(ok,'image/jpeg',q));if(blob&&blob.size<=3.8*1024*1024)return blob;}throw new Error('Gambar terlalu besar selepas dimampatkan.');}

function tracker(c){const next=task(c);const complete=milestones(c).filter(x=>x[1]).length;let eta=c.decision==='approved'&&c.route==='arrival'&&!c.arrived?(c.arrivalFrom&&c.arrivalTo?`${nice(c.arrivalFrom)} – ${nice(c.arrivalTo)}`:'Tarikh akan dikemaskini oleh salesman'):'';let description=c.decision==='declined'?'Permohonan pembiayaan tidak diluluskan. Salesman akan membantu urusan seterusnya.':c.decision==='pending'&&c.banks?.length?'Permohonan pembiayaan anda telah dihantar dan sedang menunggu keputusan.':c.decision==='approved'&&!c.louSigned?'Tahniah, permohonan pembiayaan anda telah diluluskan.':c.delivered?'Kereta anda telah diserahkan. Terima kasih kerana memilih Abang Recond.':'Semak perkembangan urusan kereta anda di sini.';return `<div class="portal"><div class="portalhead"><div class="brand">ABANG<b>RECOND</b><div class="brand-sub">MY CAR JOURNEY</div></div>${pill('Customer View')}</div><div class="hero"><div class="tag">YOUR VEHICLE</div><div class="car">${esc(c.model||'Model belum dipilih')}</div><div class="muted small">${esc(c.year||'')} · ${esc(c.colour||'')} · ${esc(c.id)}</div><div class="line"></div><div class="flex space"><strong>Journey Progress</strong><strong class="gold">${complete} / 8 · ${progress(c)}%</strong></div><div class="progress" style="margin-top:9px"><i style="width:${progress(c)}%"></i></div></div><div class="card" style="margin-top:16px"><div class="flex space"><div><div class="tag">STATUS TERKINI</div><h3 style="font-size:20px;margin:7px 0">${esc(customerStatus(c))}</h3></div>${pill(c.decision==='approved'?'Approved':next[0],c.decision==='approved'?'ok':'warn')}</div><p class="sub">${esc(description)}</p>${eta?`<div class="notice" style="margin-top:15px">📅 Anggaran ketibaan kereta di showroom: <b>${esc(eta)}</b><br><small>Anggaran ini boleh berubah.</small></div>`:''}${c.louSigned?'':c.decision==='approved'&&(c.route==='ready'||c.arrived)?'<div class="notice" style="margin-top:12px">Tindakan anda: Sila hubungi salesman untuk u function render(){if(!identity)return loginPage();if(view==='invitation')return invitationPage();if(view==='dashboard')dashboard();else if(view==='cases')cases();else if(view==='apply')apply();else if(view==='case')detail();else if(view==='portal')portal();else if(view==='lookup')lookup();else if(view==='appsetup')pwaPage();else if(view==='reviews')reviewsPage();else dashboard()}
function go(v){if(v==='invite')return inviteCustomer();if(identity?.role!=='admin'&&!['apply','lookup','appsetup'].includes(v)&&!v.startsWith('portal:'))return;if(v==='apply'&&identity?.role==='admin'){alert('Permohonan perlu dihantar sendiri oleh pelanggan. Gunakan Jemput Pelanggan.');return;}

 else if(v.startsWith('portal:')){active=v.slice(7);authCase=null;mode='customer';view='portal';}

 render();window.scrollTo(0,0);
}
function wa(c,which){
 if(!c||!c.phone){alert('No. telefon pelanggan belum ada.');return;}
 const steps=milestones(c),i=Number.isInteger(which)?which:steps.findIndex(x=>!x[1]);
 const picked=steps[i>=0?i:7];
 if(Number.isInteger(which)&&!picked[1]&&steps.findIndex(x=>!x[1])!==i){alert('Milestone ini belum bermula. Sila update progress dahulu.');return;}
 const isDeclined=i===3&&c.decision==='declined';
 const result=isDeclined?'Tidak diluluskan':picked[1]?'Selesai':'Sedang diproses';
 const statusLine=isDeclined?'Permohonan tidak diluluskan. SA akan membantu urusan bank lain atau refund.':`Milestone: ${picked[0]}\nStatus: ${result}\n${picked[2]}`;
 const tr=window.CJ_I18N?.t||((s)=>s),english=window.CJ_I18N?.getLanguage()==='en';
 const msg=english?`Hello ${c.name}.\n\nAbang Recond Customer Journey update for ${c.model||'your vehicle'}.\n\nMilestone: ${tr(picked[0])}\nStatus: ${isDeclined?'Not approved':picked[1]?'Completed':'In progress'}\n${tr(picked[2])}\n\nNext step: ${tr(task(c)[1])}.\n\nThank you. - Abang Recond`:`Assalamualaikum tuan/puan ${c.name}.\n\nUpdate Customer Journey Abang Recond untuk ${c.model||'kereta anda'}.\n\n${statusLine}\n\nLangkah seterusnya: ${task(c)[1]}.\n\nTerima kasih. - Abang Recond`;
 const raw=String(c.phone).replace(/\D/g,'');const digits=raw.startsWith('60')?raw:raw.replace(/^0/,'60');
 window.open('https://wa.me/'+encodeURIComponent(digits)+'?text='+encodeURIComponent(msg),'_blank','noopener');
}

/* ===== Upload queue + progress bar, draft autosave (v5.6) ===== */
const uploads={};const uploadQueue=[];let uploadActive=0,wakeLock=null,pendingRender=false,draftTimer=0,draftStatusMsg='';const MAX_PARALLEL_UPLOADS=2;

const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function uplHTML(slot){const u=uploads[slot];if(!u)return'';const s=u.state,pct=s==='send'?Math.round(u.pct||0):(s==='save'||s==='done')?100:0;
 const L={wait:'Menunggu giliran…',prep:'Menyediakan fail…',send:'Memuat naik…',save:'Menyimpan di pelayan…',done:'Selesai ✓',err:''}[s];
 const ind=(s==='prep'||s==='save')?' ind':'';
 return `<div class="upl${s==='done'?' done':''}${s==='err'?' err':''}" data-upl="${esc(slot)}" role="status"><div class="upl-row"><span class="upl-msg">${s==='err'?esc(u.msg||'Muat naik gagal.'):esc(u.msg||L)}${s==='send'?` <b>${pct}%</b>`:''}</span><span class="upl-file">${esc(u.name||'')}${u.size?' · '+fmtSize(u.size):''}</span></div>${s==='err'?'':`<div class="upl-track${ind}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>`}${s==='send'?'<div class="hint">Jangan tutup halaman sehingga siap.</div>':''}${s==='err'&&(u.file||u.raw)?`<button type="button" class="btn ghost sm" data-action="retryUpload:${esc(slot)}">Cuba lagi</button>`:''}</div>`;}
function uplSet(slot,p){uploads[slot]=Object.assign(uploads[slot]||{},p);const el=document.querySelector('[data-upl="'+slot+'"]');if(el){el.outerHTML=uplHTML(slot);return;}const inp=[...document.querySelectorAll('input[data-doc]')].find(i=>i.dataset.doc===slot);inp?.closest('.docrow')?.insertAdjacentHTML('beforeend',uplHTML(slot));}
async function prepareDoc(file){const ext=(file.name.split('.').pop()||'').toLowerCase(),type=file.type||({pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'}[ext]||'');
if(!file.size)throw new Error('Fail kosong. Pilih fail lain.');
if(!['application/pdf','image/jpeg','image/png','image/webp','image/heic','image/heif'].includes(type))throw new Error('Pilih gambar (JPEG, PNG, WebP, HEIC) atau PDF.');
const normalized=file.type===type?file:new File([file],file.name,{type});
// Optical character recognition and document-content inspection are intentionally excluded.
// For large browser-readable photos, try reducing transfer bytes. Preserve the
// untouched original on unsupported browsers, decode errors, or larger output.
if(normalized.size<=3*1024*1024||!['image/jpeg','image/png','image/webp'].includes(type)||typeof createImageBitmap!=='function'||typeof document==='undefined')return normalized;
let bitmap;try{
bitmap=await createImageBitmap(normalized);const longest=Math.max(bitmap.width,bitmap.height);const scale=Math.min(1,2400/longest);
const width=Math.max(1,Math.round(bitmap.width*scale)),height=Math.max(1,Math.round(bitmap.height*scale));
const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)return normalized;
ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(bitmap,0,0,width,height);
const compressed=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.88));
canvas.width=0;canvas.height=0;
if(compressed?.size>0&&compressed.size<normalized.size*.9)return new File([compressed],(normalized.name.replace(/\.[^.]+$/,'')||'dokumen')+'.jpg',{type:'image/jpeg'});
}catch(e){console.warn('Pengecilan gambar tidak tersedia; guna fail asal.',e?.name||'error');}finally{try{bitmap?.close?.();}catch{}}
return normalized;}
async function setWake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener?.('release',()=>{wakeLock=null});}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null;}}catch{}}
function enqueueUpload(slot,file){uploads[slot]={state:'wait',msg:'',pct:0,name:file.name,size:file.size,raw:file,file:null,caseId:active};uplSet(slot,{});startQueue(slot);}
function retryUpload(slot){const u=uploads[slot];if(!u||u.state!=='err')return;if(u.caseId!==active){alert('Buka semula kes asal untuk mencuba muat naik dokumen ini.');return;}uplSet(slot,{state:'wait',msg:''});startQueue(slot);}

function pumpUploads(){while(uploadActive<MAX_PARALLEL_UPLOADS&&uploadQueue.length){const slot=uploadQueue.shift();uploadActive++;setWake(true);runUpload(slot).catch(e=>{console.warn('CJ upload queue:',e?.message||e);}).finally(()=>{uploadActive--;if(!uploadActive&&!uploadQueue.length)setWake(false);pumpUploads();});}}
async function runUpload(slot){const u=uploads[slot];if(!u)return;

try{await resumableUpload(u.session,f,(p)=>uplSet(slot,{state:'send',pct:p,msg:''}));

}catch(err){if(n<3&&(!err.status||err.status>=500||[409,423,429].includes(err.status))){uplSet(slot,{state:'wait',msg:'Sambungan terganggu. Menyambung semula ('+(n+1)+'/3)…'});await sleep(1500*(n+1));continue;}throw err;}}

softRender();
}catch(err){if([400,401,403,404,410].includes(err.status))u.session=null;uplSet(slot,{state:'err',msg:err.message||'Muat naik gagal. Tekan Cuba lagi untuk menyambung.'});}}
function tusRequest(method,url,headers,data,onProgress){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open(method,url);x.timeout=180000;for(const [k,v]of Object.entries(headers))x.setRequestHeader(k,v);x.upload.onprogress=e=>{if(e.lengthComputable)onProgress?.(e.loaded);};x.onload=()=>{if(x.status>=200&&x.status<300)resolve(x);else reject(Object.assign(new Error('Muat naik gagal (kod '+x.status+'). Tekan Cuba lagi.'),{status:x.status}));};x.onerror=()=>reject(new Error('Sambungan terputus. Tekan Cuba lagi untuk menyambung.'));x.ontimeout=()=>reject(new Error('Sambungan lambat. Tekan Cuba lagi untuk menyambung.'));x.onabort=()=>reject(new Error('Muat naik dibatalkan.'));x.send(data||null);});}
async function resumableUpload(session,file,progress){

const location=created.getResponseHeader('Location');if(!location)throw new Error('Pelayan tidak memberi alamat upload. Cuba lagi.');const url=new URL(location,session.endpoint);if(url.origin!==new URL(session.endpoint).origin)throw new Error('Alamat upload tidak sah.');session.url=url.href;offset=Number(created.getResponseHeader('Upload-Offset')||0);}
