*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}

.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.chip.hum{background:var(--humbg);color:var(--hum);border-color:transparent}.chip.acc{background:var(--accbg);color:var(--acc);border-color:transparent}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer}button:hover{background:var(--soft)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:1px}

.safe{background:var(--okbg);border:1px solid transparent;border-radius:var(--r);padding:8px 12px;font-size:12.5px;color:var(--ok);margin:10px 0;display:flex;gap:10px;flex-wrap:wrap}
.safe.bad{background:var(--badbg);color:var(--bad)}.safe b{font-weight:650}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:var(--gap)}
.card.attn{border-left:5px solid var(--warn)}.card.hum{border-left:5px solid var(--hum)}.card.good{border-left:5px solid var(--ok)}.card.out{border-left:5px solid var(--mut);opacity:.9}
.hero{background:var(--accbg);border:1px solid transparent;border-radius:var(--r);padding:16px;margin:12px 0;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero.done{background:var(--okbg)}.hero h2{margin:0 0 4px;font-size:17px}.hero p{margin:0;color:var(--mut);font-size:13.5px}
.grid{display:grid;gap:var(--gap);grid-template-columns:1fr}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.lv{display:flex;gap:6px;margin:8px 0}.lv div{flex:1;text-align:center;border-radius:10px;padding:8px 2px;background:var(--soft)}.lv b{display:block;font-size:22px;line-height:1.1}.lv span{font-size:11.5px;color:var(--mut)}

.meta{display:flex;gap:8px 12px;flex-wrap:wrap;color:var(--mut);font-size:12.5px}.who{font-size:16px;font-weight:650;margin:6px 0 2px}.who small{font-weight:400;color:var(--mut);font-size:12.5px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.filters button{min-height:36px;padding:2px 12px;border-radius:999px}.filters button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.draft{margin-top:8px;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13.5px;white-space:pre-wrap}

table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12.5px}.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:flex-start;gap:2px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav.tabs::-webkit-scrollbar{display:none}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px 24px;max-height:86vh;overflow:auto;display:none;box-shadow:0 -8px 30px rgba(0,0,0,.25)}.sheet.on{display:block}

  var r=await fetch(live.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':live.anon,'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body||{}),signal:AbortSignal.timeout(12000)});
  var j=await r.json().catch(function(){return null});
  if(!r.ok)throw new Error((j&&(j.message||j.error))||('HTTP '+r.status));return j;
}
async function loadAll(){
  if(!live){D=JSON.parse($('mock-data').textContent);MOCKX=JSON.parse($('mock-data').textContent);return}
  var o={};
  var results=await Promise.all([rpc('ai_cos_brief_latest',{}),rpc('ai_followup_workbench',{p_status:'open',p_limit:200}),rpc('ai_agent_readiness',{}),rpc('ai_nightly_status',{p_days:14}),rpc('ai_routing_center_snapshot',{p_hours:24})]);
  o.brief=results[0];o.followups=results[1];o.agents=results[2];o.nightly=results[3];o.routing=results[4];
  if(!o.followups||o.followups.contract!=='followup-workbench-v1')throw new Error('bad_contract:followup');
  if(!o.brief||o.brief.contract!=='brief-v1')throw new Error('bad_contract:brief');

  o.modules=extra[0].status==='fulfilled'?extra[0].value:null;
  o.agent4=extra[1].status==='fulfilled'?extra[1].value:null;
  o.usage=extra[2].status==='fulfilled'?extra[2].value:null;
  o.ilindung=extra[3].status==='fulfilled'?extra[3].value:null;
  D=o;
}
async function act(taskId,to,note){

if(takafulOnly){var tnav=document.getElementById('takaful-tools');if(tnav)tnav.style.display='block';var cback=document.getElementById('cc-back');if(cback){cback.href='/takaful-keluarga?module=dashboard';cback.textContent='← Takaful Keluarga'}}
var leadQ='',leadWs=takafulOnly?'ilindung':'all',inboxF='all',MOCKX=null,lastAct=Date.now(),crmRes=null;
function modeCls(m){return m==='human'?'hum':m==='opted_out'?'bad':m==='awaiting_owner'?'warn':'acc'}
function modeChip(m){return '<span class="chip '+modeCls(m)+'">'+esc(T('m_'+m))+'</span>'}
async function loadLeads(){
  if(!live){var q=leadQ.toLowerCase(),all=(MOCKX.leads.rows||[]).filter(function(r){return (leadWs==='all'||(r.interests||[]).some(function(i){return i.workspace_id===leadWs}))&&(!q||(r.name||'').toLowerCase().indexOf(q)>=0||(r.model_interest||'').toLowerCase().indexOf(q)>=0)});D.leads={total:all.length,rows:all};return}
  D.leads=await rpc('ai_owner_leads',{p_workspace:leadWs==='all'?null:leadWs,p_search:leadQ||null,p_limit:100,p_offset:0});
}
async function loadInbox(){
  if(!live){var all=(MOCKX.inbox.rows||[]).filter(function(r){return inboxF==='all'||(inboxF==='needs_owner'&&r.mode==='awaiting_owner')||r.mode===inboxF});D.inbox={rows:all,unmapped_conversations:MOCKX.inbox.unmapped_conversations};return}
  D.inbox=await rpc('ai_owner_inbox',{p_filter:inboxF,p_limit:100});
}
async function ensureTab(){

}

   +'<div class="filters" role="group">'+['all','recond','proton','ilindung'].map(function(w){return '<button data-lws="'+w+'" aria-pressed="'+(leadWs===w)+'">'+esc(w==='all'?T('all'):w==='ilindung'?'Takaful Keluarga':w)+'</button>'}).join('')+'</div><p class="sub">'+esc((D.leads&&D.leads.total)||0)+' '+esc(T('leadsCount'))+'</p>';

     +'<div class="who">'+esc(r.name||T('none'))+' <small>'+esc(r.phone_masked||'')+' · '+esc(r.lead_ref)+'</small></div>'
     +'<div class="meta"><span>'+esc(r.source||'')+'</span><span>'+esc(r.status||'')+'</span><span>'+esc(r.model_interest||'')+'</span></div>'
     +'<div class="chips">'+(r.route?modeChip(r.route.mode):'')+(r.open_tasks?'<span class="chip warn">'+esc(r.open_tasks)+' '+esc(T('openFu'))+'</span>':'')+(r.milestones||[]).map(function(m){return '<span class="chip '+(m.status==='confirmed'?'ok':'')+'">'+esc(T('k_'+m.kind))+': '+esc(T('ms_'+m.status))+'</span>'}).join('')+'</div>'

function evidenceFor(d,ws){
  var sc=(d.scores||[]).filter(function(s){return s.workspace_id===ws})[0];
  if(!sc)return '<div class="meta">'+esc(T('noEvidence'))+'</div>';
  var rs=(sc.reasons||[]).slice(0,4).map(function(x){return '<li>'+esc(typeof x==='string'?x:(x.text||x.code||JSON.stringify(x)))+'</li>'}).join('');
  var ev=(sc.evidence||[]);
  return '<div class="meta"><span>'+esc(T('confidence'))+' '+esc(Math.round((sc.confidence||0)*100))+'%</span><span>'+esc(sc.ruleset||'')+'</span><span>'+esc(ev.length)+' '+esc(T('evidenceN'))+'</span></div>'+(rs?'<ul class="why">'+rs+'</ul>':'');
}

  Array.prototype.forEach.call($('sheet').querySelectorAll('[data-ovs]'),function(b){b.onclick=async function(){var w=b.dataset.ovs,lv=$('sheet').querySelector('[data-ovl="'+w+'"]').value,rs=$('sheet').querySelector('[data-ovr="'+w+'"]').value.trim();

async function openConv(id){
  var d;try{d=live?await rpc('ai_routing_conversation',{p_conversation_id:id}):MOCKX.convs[id]}catch(e){toast(T('t_err')+': '+e.message);return}
  if(!d||!d.route){toast(T('t_err'));return}
  var mode=d.route.mode,h='<h3>'+esc(d.lead_name||T('none'))+'</h3><p>'+modeChip(mode)+'</p>';
  h+='<div class="safe"><span>'+esc(T('inboxNote'))+'</span></div><h4>'+esc(T('msgsT'))+'</h4>'+((d.messages||[]).map(function(m){return '<div class="msg '+(m.role==='user'?'u':'a')+'"><small>'+esc(m.role)+' · '+esc(dt(m.created_at))+'</small><div>'+esc(m.content)+'</div></div>'}).join('')||'<div class="empty">'+esc(T('noMsgs'))+'</div>');
  h+='<h4>'+esc(T('decisionsT'))+'</h4>'+((d.decisions||[]).slice(0,4).map(function(x){return '<div class="meta"><span>'+esc(x.kind)+'</span><span>'+esc(x.reason_code)+'</span><span>'+esc(dt(x.decided_at))+'</span></div>'}).join('')||'<div class="empty">'+esc(T('none'))+'</div>');
  if(mode==='opted_out')h+='<div class="safe bad"><span>'+esc(T('optoutNote'))+'</span></div>';
  else{
    h+='<h4>'+esc(mode==='human'?T('release'):T('takeover'))+'</h4><p>'+esc(mode==='human'?T('releaseWarn'):T('takeoverWarn'))+'</p><label for="cr">'+esc(T('note'))+'</label><textarea id="cr" maxlength="300"></textarea>';
    h+='<div class="btns"><button id="sx">'+esc(T('close'))+'</button><button class="primary" id="cact">'+esc(mode==='human'?T('release'):T('takeover'))+'</button></div>';
  }
  if(mode==='opted_out')h+='<div class="btns"><button id="sx">'+esc(T('close'))+'</button></div>';
  $('sheet').innerHTML=h;$('scrim').classList.add('on');$('sheet').classList.add('on');$('sx').onclick=closeSheet;$('scrim').onclick=closeSheet;
  if($('cact'))$('cact').onclick=async function(){$('cact').disabled=true;
    try{if(live)await rpc(mode==='human'?'ai_route_release':'ai_route_takeover',{p_conversation_id:id,p_reason:$('cr').value.trim()||null});
      else{var row=(MOCKX.inbox.rows||[]).filter(function(x){return x.conversation_id===id})[0];if(row)row.mode=mode==='human'?'ai':'human'}
      closeSheet();toast(T(mode==='human'?'t_released':'t_took')+(live?'':T('t_sim')));if(live){D.inbox=null;await loadInbox()}else await loadInbox();renderInbox()}
    catch(e){$('cact').disabled=false;toast(T('t_err')+': '+e.message)}}

function confirmSheet(title,body,okLabel,fn,danger){
  $('sheet').innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(body)+'</p><div class="btns"><button id="sx">'+esc(T('cancel'))+'</button><button id="sok" class="'+(danger?'danger':'primary')+'">'+esc(okLabel)+'</button></div>';
  $('scrim').classList.add('on');$('sheet').classList.add('on');$('sx').onclick=closeSheet;$('scrim').onclick=closeSheet;
  $('sok').onclick=async function(){$('sok').disabled=true;try{await fn();closeSheet()}catch(e){$('sok').disabled=false;toast(T('t_err')+': '+e.message)}};
}

function bindControl(){
  Array.prototype.forEach.call($('p-agents').querySelectorAll('[data-tg]'),function(b){b.onclick=function(){var k=b.dataset.tg,on=b.dataset.to==='1';
    confirmSheet(T(on?'switchOn':'switchOff'),T('toggleWarn'),T('confirm'),async function(){
      if(live){await rpc('ai_set_agent_enabled',{p_agent_key:k,p_enabled:on});D.modules=await rpc('ai_modules_status',{});try{D.agent4=await rpc('ai_agent4_status',{})}catch(e){}}

      toast(T('t_saved')+(live?'':T('t_sim')));renderAgents()},!on)}});

  document.documentElement.lang=lang;$('h1').textContent=T('h1');$('gt').textContent=T('gt');$('gl-src').textContent=T('src');$('gl-pw').textContent=T('pw');$('go').textContent=T('go');
  $('src').options[0].textContent=T('mock');$('src').options[1].textContent=T('live');
  $('srcchip').textContent=live?(PROD?(CFG.mode==='staging'?'STAGING':T('prodchip')):T('livechip')):(PROD&&$('src').value==='live'?(lang==='ms'?'Akses owner':'Owner access'):T('sample'));$('srcchip').className='chip '+(live?'ok':'warn');
  Array.prototype.forEach.call(document.querySelectorAll('.liveonly'),function(e){e.classList.toggle('hidden',$('src').value!=='live'||(PROD&&!!e.querySelector('#url,#anon')))});
  $('l-ms').setAttribute('aria-pressed',lang==='ms');$('l-en').setAttribute('aria-pressed',lang==='en');
  if(!D){return}
  $('asof').textContent=(D.brief&&D.brief.brief_date?D.brief.brief_date+' · ':'')+'Asia/Kuala_Lumpur';
  renderSafe();renderTabs();renderToday();renderFu();renderAgents();renderNight();renderRoute();if(tab==='leads'&&D.leads)renderLeads();if(tab==='inbox'&&D.inbox)renderInbox();
}
$('l-ms').onclick=function(){lang='ms';render()};$('l-en').onclick=function(){lang='en';render()};$('src').onchange=render;
$('go').onclick=async function(){
  $('gerr').classList.add('hidden');$('go').disabled=true;
  try{
    if($('src').value==='mock'){live=null;tok=null}
    else{var url=PROD?CFG.base:$('url').value.trim().replace(/\/$/,''),anon=PROD?CFG.anon:$('anon').value.trim();
      var r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':anon,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})});
      var j=await r.json();if(!r.ok||!j.access_token)throw new Error(j.error_description||j.msg||'login failed');tok=j.access_token;live={url:url,anon:anon};$('pw').value='';lastAct=Date.now()}
    await loadAll();$('gate').classList.add('hidden');$('app').classList.remove('hidden');tab='today';show();
  }catch(e){D=null;live=null;tok=null;$('gerr').textContent=e.message==='OWNER_ONLY'?(lang==='ms'?'Akaun ini bukan owner. Halaman ini untuk owner sahaja (OWNER_ONLY).':'This account is not the owner. Owner only (OWNER_ONLY).'):(lang==='ms'?'Tidak dapat memuatkan: ':'Could not load: ')+e.message;$('gerr').classList.remove('hidden')}
  $('go').disabled=false;
};
function lockdown(msg){tok=null;live=null;D=null;closeSheet();if(PROD){$('app').classList.remove('hidden');$('gate').classList.add('hidden');$('cc-data').classList.add('hidden');$('cc-progress').classList.remove('hidden');$('cc-progress').innerHTML='<p>'+esc(msg||'Sesi tamat.')+'</p><p><a href="/">Kembali ke dashboard</a></p>';}else{$('app').classList.add('hidden');$('gate').classList.remove('hidden');if(msg){$('gerr').textContent=msg;$('gerr').classList.remove('hidden')}}render()}
if(PROD){
  $('src').value='live';Array.prototype.forEach.call(document.querySelectorAll('#gate label'),function(l){if(l.querySelector('#src,#url,#anon'))l.classList.add('hidden')});
  Array.prototype.forEach.call(document.querySelectorAll('.liveonly'),function(l){if(l.querySelector('#url,#anon'))l.classList.add('hidden')});
  ['click','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){lastAct=Date.now()},true)});
  setInterval(function(){if(tok&&Date.now()-lastAct>20*60*1000)lockdown(T('idle'))},30000);
}
render();
// AI_CC_SHARED_SESSION_V1 (same-tab, no second password)
(function(){
if(!PROD)return;
var KEY="rc4.sess", info=document.getElementById("cc-sso-message"),expiry=0,busy=false;
$("gt").textContent="Satu login untuk Kerja Sendiri";$("go").disabled=true;
function note(s){info.textContent=s;}
function readToken(){try{var d=JSON.parse(sessionStorage.getItem(KEY)||"null");return d&&typeof d.r==="string"&&d.r.length?d.r:null}catch(_){return null}}
async function renew(t){
var r=await fetch("/api/supabase/auth/v1/token?grant_type=refresh_token",{method:"POST",cache:"no-store",credentials:"omit",headers:{"apikey":CFG.anon,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:t}),signal:AbortSignal.timeout(12000)});
var j=await r.json().catch(function(){return {}});if(!r.ok||!j.access_token||!j.refresh_token)throw Error(r.status===400||r.status===401?"EXPIRED":"REFRESH_FAILED");
sessionStorage.setItem(KEY,JSON.stringify({r:j.refresh_token}));if(window.ksSessionSync)window.ksSessionSync.rotated(j.refresh_token);return j;
}
function progressInfo(message,canRetry){
var el=$('cc-progress');el.classList.remove('hidden');el.textContent=message;
if(canRetry){var btn=document.createElement('button');btn.type='button';btn.className='sm';btn.textContent='Cuba lagi';btn.addEventListener('click',function(){if(tok&&live){void loadData()}else{void start()}});el.appendChild(document.createTextNode(' '));el.appendChild(btn)}
}
async function loadData(){
 $('cc-data').classList.add('hidden');progressInfo('Memuatkan data jualan…',false);
 try{await loadAll();tab=takafulOnly?(new URLSearchParams(location.search).get('tab')||'leads'):'today';if(!['today','leads','inbox','fu','agents','night','route'].includes(tab))tab='leads';lastAct=Date.now();$('cc-data').classList.remove('hidden');$('cc-progress').classList.add('hidden');await show();}
 catch(e){D=null;$('cc-data').classList.add('hidden');progressInfo('Data belum dapat dimuatkan ('+String(e.message||'network').slice(0,90)+').',true)}
}
async function start(){
 $('gate').classList.add('hidden');$('app').classList.remove('hidden');$('cc-data').classList.add('hidden');progressInfo('Membuka dashboard…',false);
 var t=readToken();if(!t){progressInfo('Sila buka halaman ini daripada dashboard Kerja Sendiri selepas log masuk.',false);return}
 try{
 var j=await renew(t);tok=j.access_token;live={url:CFG.base,anon:CFG.anon};expiry=(Number(j.expires_at||0)*1000)||(Date.now()+Number(j.expires_in||3600)*1000);
 var ok=await rpc('ai_is_owner',{});if(ok!==true)throw Error('OWNER_ONLY');
 await loadData();
 }catch(e){tok=null;live=null;D=null;$('cc-data').classList.add('hidden');
 if(e.message==='EXPIRED'){try{sessionStorage.removeItem(KEY)}catch(_){}progressInfo('Sesi tamat. Sila masuk melalui dashboard Kerja Sendiri.',false)}
 else if(e.message==='OWNER_ONLY')progressInfo('Akses ini hanya untuk owner Kerja Sendiri.',false);
 else progressInfo('Sambungan sesi terganggu. Cuba lagi.',true);
 }
}
setInterval(async function(){if(!tok||!live||busy||Date.now()<expiry-180000||Date.now()-lastAct>1200000)return;
busy=true;try{var prior=tok;var j=await renew(readToken());if(tok===prior){tok=j.access_token;expiry=(Number(j.expires_at||0)*1000)||(Date.now()+Number(j.expires_in||3600)*1000)}}
catch(e){lockdown("Sesi tamat. Kembali ke dashboard.");}finally{busy=false;}
},60000);void start();
if(window.ksSessionSync)window.ksSessionSync.on(function(m){if(m.t==="logout")lockdown("Anda telah log keluar dari dashboard. Log masuk semula di dashboard.")});
window.addEventListener("pageshow",function(e){if(e.persisted&&tok&&!readToken())lockdown("Sesi tamat. Kembali ke dashboard.")});
})();
</script>
